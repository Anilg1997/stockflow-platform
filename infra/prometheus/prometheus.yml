# ═══════════════════════════════════════════════════════════════
# StockFlow Platform — Prometheus Configuration
# ═══════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:

  # ── Eureka / Service Discovery ─────────────────────────────
  - job_name: 'spring-cloud'
    metrics_path: '/actuator/prometheus'
    eureka_sd_configs:
      - server: http://service-registry:8761/eureka
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
      - source_labels: [__meta_eureka_instance_host_name]
        target_label: instance
      - source_labels: [__meta_eureka_instance_metadata_management_port]
        target_label: management_port
      - source_labels: [__address__]
        target_label: instance

  # ── Infrastructure ─────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
