spring:
  application: { name: mf-holdings-service }
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockflow}
    username: ${POSTGRES_USER:stockflow}
    password: ${POSTGRES_PASSWORD:StockFlow@2024}
  jpa:
    hibernate: { ddl-auto: validate }
    properties:
      hibernate: { dialect: org.hibernate.dialect.PostgreSQLDialect, default_schema: mf_schema }
server: { port: 8092 }
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
logging: { level: { com.stockflow: DEBUG } }
