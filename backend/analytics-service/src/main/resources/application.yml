spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stockflow}
    username: ${POSTGRES_USER:stockflow}
    password: ${POSTGRES_PASSWORD:StockFlow@2024}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: analytics_schema
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://stockflow:Mongo@2024@localhost:27017/stockflow?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
server:
  port: 8099
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
logging:
  level:
    com.stockflow: DEBUG
