<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Inter', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#F9FAFB"/>
  <!-- Header -->
  <rect width="1200" height="64" fill="white"/>
  <rect x="0" y="64" width="1200" height="1" fill="#E5E7EB"/>
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#4F46E5"/>
  <text x="24" y="38" font-size="14" fill="white" font-weight="700" text-anchor="middle">SF</text>
  <text x="60" y="39" font-size="20" fill="#111827" font-weight="700">StockFlow</text>
  <!-- Search bar -->
  <rect x="320" y="16" width="260" height="32" rx="8" fill="#F3F4F6"/>
  <text x="340" y="36" font-size="13" fill="#9CA3AF">🔍 Search stocks, MF, IPO...</text>
  <!-- Notification bell -->
  <circle cx="900" cy="32" r="6" fill="#EF4444"/>
  <!-- User avatar -->
  <circle cx="980" cy="32" r="16" fill="#EEF2FF"/>
  <text x="980" y="38" font-size="13" fill="#4F46E5" font-weight="600" text-anchor="middle">A</text>
  <text x="1002" y="38" font-size="13" fill="#374151" font-weight="500">Anil</text>
  <!-- Sidebar -->
  <rect x="0" y="64" width="256" height="686" fill="white"/>
  <rect x="0" y="64" width="1" height="686" fill="#E5E7EB" transform="translate(255)"/>
  <rect x="16" y="80" width="224" height="40" rx="8" fill="#EEF2FF"/>
  <text x="44" y="106" font-size="13" fill="#4F46E5" font-weight="600">🏠 Dashboard</text>
  <rect x="16" y="126" width="224" height="40" rx="8" fill="transparent"/>
  <text x="44" y="152" font-size="13" fill="#6B7280">📈 Trading</text>
  <rect x="16" y="172" width="224" height="40" rx="8" fill="transparent"/>
  <text x="44" y="198" font-size="13" fill="#6B7280">💼 Portfolio</text>
  <rect x="16" y="218" width="224" height="40" rx="8" fill="transparent"/>
  <text x="44" y="244" font-size="13" fill="#6B7280">⭐ Watchlist</text>
  <!-- Section header -->
  <text x="24" y="290" font-size="11" fill="#9CA3AF" font-weight="600" letter-spacing="1">INVESTMENTS</text>
