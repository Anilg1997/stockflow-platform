  <text x="44" y="331" font-size="13" fill="#6B7280">💰 Mutual Funds</text>
  <rect x="16" y="351" width="224" height="40" rx="8" fill="transparent"/>
  <text x="44" y="377" font-size="13" fill="#6B7280">🚀 IPOs</text>
