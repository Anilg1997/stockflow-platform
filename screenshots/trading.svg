  <text x="746" y="507" font-size="11" fill="#DC2626" font-weight="600">SELL</text>
  <text x="802" y="507" font-size="13" fill="#111827" font-weight="600">TCS</text>
  <text x="802" y="522" font-size="11" fill="#6B7280">10 shares @ ₹3,920.00</text>
  <rect x="1072" y="494" width="60" height="22" rx="6" fill="#D1FAE5"/>
  <text x="1088" y="509" font-size="11" fill="#059669" font-weight="600">EXECUTED</text>
