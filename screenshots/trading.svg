  <rect x="16" y="16" width="32" height="32" rx="8" fill="#4F46E5"/>
  <text x="24" y="38" font-size="14" fill="white" font-weight="700" text-anchor="middle">SF</text>
  <text x="60" y="39" font-size="20" fill="#111827" font-weight="700">StockFlow</text>
