  <text x="306" y="174" font-size="15" fill="#111827" font-weight="600">🤖 AI Market Summary</text>
  <text x="306" y="196" font-size="12" fill="#6B7280">📈 NIFTY 50 predicted to reach <tspan fill="#059669" font-weight="600">24,200-24,500</tspan> range this week (+2.3% upside)</text>
  <text x="306" y="216" font-size="12" fill="#6B7280">⚡ <tspan fill="#DC2626" font-weight="600">Alert:</tspan> IT sector showing bearish signals — consider reducing exposure by 5-10%</text>
  <text x="306" y="236" font-size="12" fill="#6B7280">💡 <tspan fill="#059669" font-weight="600">Recommendation:</tspan> Banking &amp; Pharma sectors show strong fundamentals — consider accumulation</text>

  <!-- AI Cards Row -->
