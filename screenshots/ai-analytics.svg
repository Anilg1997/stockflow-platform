  <text x="910" y="338" font-size="12" fill="#6B7280">AI Analysis of 1,200+ news articles:</text>
  <rect x="910" y="350" rx="6" ry="6" width="240" height="24" fill="#ECFDF5"/>
  <text x="922" y="367" font-size="11" fill="#059669">👍 Bullish: Banking ⭐</text>
  <rect x="910" y="378" rx="6" ry="6" width="240" height="24" fill="#FEF2F2"/>
  <text x="922" y="395" font-size="11" fill="#DC2626">👎 Bearish: IT ⚠️</text>
  <rect x="910" y="406" rx="6" ry="6" width="240" height="24" fill="#ECFDF5"/>
  <text x="922" y="423" font-size="11" fill="#059669">👍 Bullish: Pharma ⭐</text>
  <rect x="910" y="434" rx="6" ry="6" width="240" height="24" fill="#FFF7ED"/>
  <text x="922" y="451" font-size="11" fill="#f59e0b">➡ Neutral: Auto</text>

  <!-- AI Chat / Assistant -->
  <rect x="280" y="515" rx="12" ry="12" width="890" height="200" fill="white" filter="url(#shadow)"/>
  <text x="300" y="546" font-size="15" fill="#111827" font-weight="600">💬 Ask AI Analyst</text>
  <rect x="300" y="560" rx="12" ry="12" width="420" height="80" fill="#F3F4F6"/>
  <text x="316" y="584" font-size="13" fill="#333">Which stocks should I buy this month for</text>
  <text x="316" y="604" font-size="13" fill="#333">long-term investment with moderate risk?</text>
  <text x="316" y="628" font-size="11" fill="#9CA3AF">10:32 AM</text>
  <rect x="740" y="560" rx="12" ry="12" width="410" height="100" fill="#EEF2FF"/>
  <text x="756" y="584" font-size="13" fill="#333" font-weight="600">Based on your profile and market analysis:</text>
  <text x="756" y="606" font-size="12" fill="#333">1. <tspan fill="#4F46E5" font-weight="600">HDFC Bank</tspan> — Strong fundamentals, P/E 18.5, target ₹1,850</text>
  <text x="756" y="626" font-size="12" fill="#333">2. <tspan fill="#4F46E5" font-weight="600">Reliance Industries</tspan> — Diversified, new energy play, target ₹3,200</text>
  <text x="756" y="646" font-size="12" fill="#333">3. <tspan fill="#4F46E5" font-weight="600">Sun Pharma</tspan> — R&amp;D pipeline strong, target ₹1,650</text>
  <!-- Input -->
  <rect x="300" y="660" rx="20" ry="20" width="740" height="40" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="316" y="686" font-size="13" fill="#9CA3AF">Ask the AI analyst for personalized investment advice...</text>
  <circle cx="1000" cy="680" r="18" fill="#4F46E5"/>
  <polygon points="994,680 1006,673 1006,687" fill="white"/>
