<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="regBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#regBg)"/>
  <rect x="390" y="60" width="420" height="640" rx="16" fill="white" filter="drop-shadow(0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.06))"/>
  <rect x="560" y="80" width="64" height="64" rx="16" fill="#4F46E5" filter="drop-shadow(0 4px 6px rgba(79,70,229,0.25))"/>
  <text x="568" y="120" font-size="28" fill="white" font-weight="700" text-anchor="middle">SF</text>
  <text x="600" y="180" font-size="24" fill="#111827" font-weight="700" text-anchor="middle">Create your account</text>
  <text x="600" y="206" font-size="14" fill="#6B7280" text-anchor="middle">Start your investing journey today</text>
  <!-- Form -->
  <text x="420" y="240" font-size="13" fill="#374151" font-weight="500">Full Name</text>
  <rect x="420" y="248" width="360" height="44" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="440" y="275" font-size="14" fill="#9CA3AF">John Doe</text>
  <text x="420" y="315" font-size="13" fill="#374151" font-weight="500">Email</text>
  <rect x="420" y="323" width="360" height="44" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="440" y="350" font-size="14" fill="#9CA3AF">you@example.com</text>
  <text x="420" y="390" font-size="13" fill="#374151" font-weight="500">Phone (optional)</text>
  <rect x="420" y="398" width="360" height="44" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="440" y="425" font-size="14" fill="#9CA3AF">+91 98765 43210</text>
  <text x="420" y="465" font-size="13" fill="#374151" font-weight="500">Password</text>
  <rect x="420" y="473" width="360" height="44" rx="10" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="440" y="500" font-size="14" fill="#9CA3AF">Create a strong password</text>
  <rect x="420" y="535" width="360" height="46" rx="10" fill="#4F46E5"/>
  <text x="600" y="564" font-size="14" fill="white" font-weight="600" text-anchor="middle">Create Account</text>
  <text x="600" y="620" font-size="14" fill="#6B7280" text-anchor="middle">Already have an account? <tspan fill="#4F46E5" font-weight="600">Sign in</tspan></text>
</svg>
